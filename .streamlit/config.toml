[theme]
base = "light"
primaryColor = "#1F3A5F"
backgroundColor = "#FAF8F4"
secondaryBackgroundColor = "#F1EDE4"
textColor = "#18222F"
linkColor = "#1F3A5F"
borderColor = "#E3DDD0"
dataframeBorderColor = "#ECE7DC"
dataframeHeaderBackgroundColor = "#F4F1EA"
baseRadius = "10px"
font = "Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"

[[theme.fontFaces]]
family = "Pretendard"
url = "https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/packages/pretendard/dist/web/variable/woff2/PretendardVariable.woff2"
weight = "45 920"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
